<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>STUDYVERSE — умный помощник студента</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #090d1a;
        --panel: rgba(17, 24, 39, 0.68);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --purple: #8b5cf6;
        --cyan: #22d3ee;
        --lime: #84cc16;
        --border: rgba(255, 255, 255, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        color: var(--text);
        background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.25), transparent 45%),
                    radial-gradient(circle at left center, rgba(34, 211, 238, 0.18), transparent 40%),
                    var(--bg);
        min-height: 100vh;
      }
      .app {
        max-width: 1220px;
        margin: 0 auto;
        padding: 22px 18px 80px;
      }
      .glass {
        background: var(--panel);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        position: sticky;
        top: 10px;
        z-index: 5;
      }
      .brand {
        font-weight: 800;
        letter-spacing: .1em;
      }
      .badge {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .hero {
        margin-top: 18px;
        padding: 28px;
        display: grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 16px;
      }
      h1 { font-size: clamp(30px, 5vw, 54px); margin: 0 0 12px; line-height: 1.03; }
      h2 { margin: 0 0 10px; font-size: 22px; }
      p { color: var(--muted); margin: 0; line-height: 1.5; }
      .cta {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button, .btn {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        color: #05070f;
        font-weight: 700;
        cursor: pointer;
        transition: transform .15s ease, opacity .15s;
      }
      button:hover, .btn:hover { transform: translateY(-2px); }
      .primary { background: linear-gradient(90deg, var(--purple), var(--cyan)); color: white; }
      .secondary { background: #1f2937; color: #d1d5db; border: 1px solid var(--border); }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }
      .stat { padding: 12px; border-radius: 14px; background: rgba(0,0,0,.2); border: 1px solid var(--border); }
      .stat strong { font-size: 24px; display: block; }
      .grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 14px;
      }
      .col-4 { grid-column: span 4; }
      .col-6 { grid-column: span 6; }
      .col-8 { grid-column: span 8; }
      .col-12 { grid-column: span 12; }
      .card { padding: 18px; }
      .kpi-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
      .chip {
        font-size: 12px;
        color: #d1d5db;
        background: rgba(255,255,255,.05);
        border: 1px solid var(--border);
        padding: 5px 9px;
        border-radius: 999px;
      }
      textarea, input, select {
        width: 100%;
        margin-top: 8px;
        background: rgba(17,24,39,.8);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
      }
      .list { margin: 10px 0 0; padding-left: 18px; color: #d1d5db; }
      .list li { margin: 6px 0; }
      .progress {
        width: 100%;
        background: rgba(255,255,255,.08);
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar { height: 100%; background: linear-gradient(90deg, var(--lime), var(--cyan)); transition: width .4s; }
      .timeline { margin-top: 8px; display: grid; gap: 8px; }
      .event { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,.04); }
      footer { text-align: center; margin-top: 20px; color: var(--muted); font-size: 12px; }
      @media (max-width: 900px) {
        .hero { grid-template-columns: 1fr; }
        .col-4, .col-6, .col-8 { grid-column: span 12; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useMemo, useState } = React;

      const documents = [
        "Лекция 4: Машинное обучение.pdf",
        "Слайды по матанализу.pptx",
        "Практикум C++ (фото).jpg",
      ];

      function Hero() {
        return (
          <section className="hero glass">
            <div>
              <div className="chip">STUDYVERSE • AI Student OS</div>
              <h1>Вселенная, где студент контролирует учёбу, время и жизнь</h1>
              <p>
                Платформа объединяет учёбу, AI-помощника, расписание, аналитику, мотивацию и
                социальные группы в одном интерфейсе tech/minimal в стиле Notion + ChatGPT.
              </p>
              <div className="cta">
                <button className="primary">Начать бесплатно</button>
                <button className="secondary">Демо режима экзамена</button>
              </div>
              <div className="stats">
                <div className="stat"><strong>+37%</strong><span>рост успеваемости</span></div>
                <div className="stat"><strong>12ч</strong><span>экономии в неделю</span></div>
                <div className="stat"><strong>-41%</strong><span>прокрастинации</span></div>
              </div>
            </div>
            <div className="glass card">
              <h2>Smart Snapshot</h2>
              <p>Сегодня: 3 дедлайна, 2 пары, 1 повторение перед экзаменом.</p>
              <ul className="list">
                <li>🔥 Приоритет: курсовая по БД (до 23:59)</li>
                <li>🧠 Повторить: интегралы и ряды (45 мин)</li>
                <li>🧘 Тревога: средняя — включён анти-выгорание режим</li>
              </ul>
            </div>
          </section>
        );
      }

      function StudyLab() {
        const [topic, setTopic] = useState("Нейронные сети");
        return (
          <section className="glass card col-8">
            <h2>📚 Учёба: интеллектуальная обработка материалов</h2>
            <p>Загружай PDF/DOCX/PPT/фото и получай структурированный результат.</p>
            <div className="kpi-row">
              {documents.map((d) => <span key={d} className="chip">{d}</span>)}
            </div>
            <label>
              Тема для объяснения
              <input value={topic} onChange={(e) => setTopic(e.target.value)} />
            </label>
            <div className="grid" style={{ marginTop: 10 }}>
              <div className="col-6">
                <div className="glass card">
                  <strong>Краткое содержание</strong>
                  <ul className="list">
                    <li>{topic}: ключевые термины и определения</li>
                    <li>3 главные формулы с примерами</li>
                    <li>Типовые ошибки на экзамене</li>
                  </ul>
                </div>
              </div>
              <div className="col-6">
                <div className="glass card">
                  <strong>Генерация</strong>
                  <ul className="list">
                    <li>Mind-map + карточки для повторения</li>
                    <li>10 тестовых вопросов и разбор</li>
                    <li>Шпаргалка 1 лист А4 + экзаменационные вопросы</li>
                  </ul>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function Assistant() {
        const [role, setRole] = useState("friend");
        const tones = {
          friend: "Давай спокойно разберёмся шаг за шагом 👌",
          teacher: "Объясню тему системно, с акцентом на понимание.",
          examiner: "Вопрос №1: докажите сходимость ряда и обоснуйте критерий.",
        };
        return (
          <section className="glass card col-4">
            <h2>🧠 AI-помощник</h2>
            <p>Роли: преподаватель, строгий экзаменатор, друг-наставник.</p>
            <select value={role} onChange={(e) => setRole(e.target.value)}>
              <option value="friend">Друг-наставник</option>
              <option value="teacher">Преподаватель</option>
              <option value="examiner">Строгий экзаменатор</option>
            </select>
            <div className="glass card" style={{ marginTop: 10 }}>
              <strong>Ответ ассистента:</strong>
              <p style={{ marginTop: 8 }}>{tones[role]}</p>
            </div>
            <ul className="list">
              <li>Эссе/курсовая с оформлением ГОСТ, APA, MLA</li>
              <li>Проверка грамматики, структуры и уникальности</li>
              <li>Объяснение: «для чайника» / «для преподавателя»</li>
            </ul>
          </section>
        );
      }

      function TimeAndProgress() {
        const [done, setDone] = useState(5);
        const progress = useMemo(() => Math.min(100, Math.round((done / 8) * 100)), [done]);

        return (
          <>
            <section className="glass card col-6">
              <h2>⏰ Тайм-менеджмент</h2>
              <p>Умное расписание, напоминания и анти-прокрастинация.</p>
              <div className="timeline">
                <div className="event">09:00 — Пара: Алгоритмы</div>
                <div className="event">14:00 — Pomodoro ×4 (курсовая)</div>
                <div className="event">19:00 — Повторение перед экзаменом</div>
              </div>
              <div className="kpi-row">
                <span className="chip">⚠️ Ты отстаёшь по 2 задачам</span>
                <span className="chip">🔔 Скоро экзамен (через 5 дней)</span>
              </div>
            </section>

            <section className="glass card col-6">
              <h2>📊 Аналитика и прогноз</h2>
              <p>Оценка нагрузки, продуктивности и вероятности сдачи сессии.</p>
              <label>
                Выполнено задач за неделю: {done}/8
                <input type="range" min="0" max="8" value={done} onChange={(e) => setDone(+e.target.value)} />
              </label>
              <div className="progress"><div className="bar" style={{ width: `${progress}%` }} /></div>
              <div className="kpi-row">
                <span className="chip">Прогноз экзамена: {60 + Math.round(progress * 0.35)} / 100</span>
                <span className="chip">Риск выгорания: {progress < 45 ? "Высокий" : "Контролируемый"}</span>
              </div>
            </section>
          </>
        );
      }

      function WellnessAndSocial() {
        return (
          <>
            <section className="glass card col-4">
              <h2>🧘 Психология</h2>
              <ul className="list">
                <li>Трекер выгорания + режим «мне сейчас тяжело»</li>
                <li>Поддержка перед экзаменом и breathing-паузы</li>
                <li>AI-советы по сну, отдыху и фокус-сессиям</li>
              </ul>
            </section>
            <section className="glass card col-8">
              <h2>👥 Социальные функции</h2>
              <div className="grid" style={{ marginTop: 8 }}>
                <div className="col-6"><div className="glass card"><strong>Группы</strong><p>Совместные конспекты, трек задач и peer-review.</p></div></div>
                <div className="col-6"><div className="glass card"><strong>Community Q&A</strong><p>Анонимные вопросы и рейтинг полезных ответов.</p></div></div>
              </div>
              <div className="kpi-row">
                <span className="chip">Геймификация: уровни, XP, достижения</span>
                <span className="chip">Персонализация под факультет</span>
                <span className="chip">Голосовой ввод и озвучка конспектов</span>
              </div>
            </section>
          </>
        );
      }

      function Architecture() {
        return (
          <section className="glass card col-12">
            <h2>⚙️ Проектная структура и API</h2>
            <pre style={{whiteSpace:'pre-wrap', color:'#cbd5e1', fontSize:12, margin:0}}>{`studyverse/
  apps/
    web/ (Next.js, PWA, UI-kit, offline cache)
    api/ (Node.js + Express/Fastify)
  packages/
    ai-core/ (pipeline: ingest -> summarize -> quiz -> explain)
    scheduler/ (planner, pomodoro, deadline predictor)
    analytics/ (progress engine, burnout index)
    shared/ (types, validation schemas)
  infra/
    postgres/, redis/, object-storage/

REST API examples:
POST /api/auth/email
POST /api/auth/google
POST /api/materials/upload
POST /api/materials/:id/summarize
POST /api/assistant/chat
GET  /api/dashboard/overview
POST /api/schedule/auto-plan
GET  /api/analytics/exam-forecast
POST /api/wellness/checkin
POST /api/groups/:id/notes`}</pre>
          </section>
        );
      }

      function App() {
        return (
          <div className="app">
            <header className="glass">
              <div className="brand">STUDYVERSE</div>
              <div className="badge">PWA • Dark Neon • Adaptive</div>
            </header>
            <Hero />
            <main className="grid">
              <StudyLab />
              <Assistant />
              <TimeAndProgress />
              <WellnessAndSocial />
              <Architecture />
            </main>
            <footer>© STUDYVERSE • Student Superapp Prototype</footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
      }
    </script>
  </body>
</html>
